[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glove-word-embeddings"
version = "0.1.15"
description = "Validate, categorize, and embed words for academic research (Wang et al., 2026 and Olson et al., 2021)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dawei Wang"}]
dependencies = ["requests", "numpy", "nltk"]
urls = {Homepage = "https://github.com/dtzx00/GloVe-Word-Embeddings"}

[tool.setuptools]
py-modules = ["glove_word_embeddings"]
